<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public

    # Hanya folder public/ yang terbuka ke web; .env, app/, vendor/, storage/ berada di luar
    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>

    # Log ke stdout/stderr agar muncul di dasbor Render
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
